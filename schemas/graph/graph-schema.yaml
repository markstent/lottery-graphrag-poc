# As-built Neo4j overlay model; mirrors app/graph/statements.py registries
# (tests/test_graph_statements.py keeps the two in step).
schema_version: "2.0.0"
node_types:
- Market
- Region
- Language
- Currency
- Channel
- Supplier
- Platform
- PlatformVersion
- AppVersion
- GameFamily
- GameCategory
- GameMechanic
- Game
- Draw
- PrizeType
- PlayerSegment
- Player
- Device
- PaymentMethod
- PaymentProvider
- Campaign
- Experiment
- Incident
- IncidentType
- SupportCase
- SupportCategory
- Document
- DocumentChunk
- BusinessConcept
relationship_types:
- AFFECTS
- AFFECTS_MARKET
- AVAILABLE_IN
- AVAILABLE_VIA
- BELONGS_TO
- CATEGORISED_AS
- CONCERNS
- DEPLOYED_TO
- EXPOSED_TO
- FROM_MARKET
- HAS_CHUNK
- HAS_DRAW
- HAS_MECHANIC
- INSTANCE_OF
- IS_A
- MAPS_TO
- OF_TYPE
- PLAYS
- PROMOTES
- PROVIDED_BY
- REFERENCES
- RELATED_TO
- RELATED_TO_VERSION
- RELATED_TO_APP_VERSION
- RUNS_ON
- SIMILAR_TO
- TARGETS
- USES
- USES_PAYMENT
- VERSION_OF
# Edges that exist only because of the enterprise ontology (configuration C).
ontology_relationship_types:
- MAPS_TO
- SIMILAR_TO
- IS_A
required_node_properties:
- id
- label_version
- source_system
- source_record_id
- ingestion_version
default_limits:
  max_hops: 4
  max_candidate_nodes: 250
  max_visible_nodes: 80
  max_visible_edges: 120
