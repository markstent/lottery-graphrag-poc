[project]
name = "semantic-context-lab-backend"
version = "0.1.0"
description = "Semantic Context Lab backend: experiment orchestrator, retrieval and evaluation services (POC)"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.142.2",
    "neo4j>=6.4.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# DDL definitions and multilingual document templates exceed the line limit
# by nature; ambiguous-unicode flags fire on intentional non-Latin text.
"app/datasets/world.py" = ["E501"]
"app/datasets/documents.py" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -W error"
