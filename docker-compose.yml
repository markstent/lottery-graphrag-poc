# Local service dependencies only: Neo4j (the graph) and Qdrant (the vector
# index). The backend and frontend run directly on the host (make dev), and
# nothing in the application is containerised. Image versions are pinned;
# bump deliberately.

services:
  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474" # HTTP browser/API
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-devpassword}
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  neo4j_data:
  qdrant_data:
