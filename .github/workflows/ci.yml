name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/devpassword
        ports:
          - 7687:7687
          # The HTTP endpoint must be published for the wget health check
          # below; Bolt alone is not reachable from the runner.
          - 7474:7474
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.14.1
        ports:
          - 6333:6333
        # No container health check: the Qdrant image ships no shell tools,
        # so a wget-based health command can never succeed. Readiness is
        # polled from a workflow step below instead.
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: devpassword
      GRAPH_E2E: "1"
      VECTOR_E2E: "1"
      QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:6333/readyz >/dev/null; then
              echo "Qdrant is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1
      - name: Run checks
        working-directory: backend
        run: |
          uv sync
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy
          uv run pytest -rs

  frontend:
    name: Frontend (prettier, oxlint, tsc, vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Run checks
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm api:check
          pnpm test
          pnpm build

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies and browsers
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run smoke tests
        working-directory: frontend
        env:
          # A hosted runner lays the 200-node graph out in about 1.8 s against
          # about 0.7 s on the presentation Mac (graph-canvas-200.spec.ts).
          GRAPH_LAYOUT_BUDGET_MS: "3000"
        run: |
          pnpm build
          pnpm e2e
